<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <linearGradient id="twp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a2b"/>
      <stop offset="0.45" stop-color="#2e4a68"/>
      <stop offset="0.78" stop-color="#6e8aa6"/>
      <stop offset="1" stop-color="#b9c9d8"/>
    </linearGradient>
    <linearGradient id="twp-thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3550"/>
      <stop offset="1" stop-color="#7f9cb8"/>
    </linearGradient>
  </defs>

  <!-- The wallpaper itself. -->
  <rect width="640" height="300" rx="20" fill="url(#twp-sky)"/>
  <circle cx="472" cy="104" r="42" fill="#f0d9a8" fill-opacity="0.16"/>
  <circle cx="472" cy="104" r="18" fill="#f4e2bb" fill-opacity="0.92"/>
  <path d="M0 214l96-62 74 48 96-70 118 84 76-52 100 66v72H0z" fill="#1a2a3e" fill-opacity="0.86"/>
  <path d="M0 300v-62l92-32 88 28 92-44 112 40 124-50 120 44v76z" fill="#0d1725"/>

  <!-- App window: translucent surfaces let the wallpaper show through. -->
  <rect x="32" y="32" width="576" height="236" rx="16" fill="#f7f8fa" fill-opacity="0.62"/>
  <rect x="32" y="32" width="576" height="236" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Title strip spanning the full window, traffic lights included. -->
  <path d="M48 32h544a16 16 0 0 1 16 16v10H32V48a16 16 0 0 1 16-16z" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="50" cy="45" r="3.5" fill="#f26d6d"/>
  <circle cx="62" cy="45" r="3.5" fill="#f2c14e"/>
  <circle cx="74" cy="45" r="3.5" fill="#5fc46f"/>

  <!-- Sidebar column. -->
  <rect x="160" y="58" width="1.2" height="210" fill="#1f2a37" fill-opacity="0.12"/>
  <rect x="44" y="70" width="100" height="9" rx="4.5" fill="#1f2a37" fill-opacity="0.34"/>
  <rect x="44" y="92" width="84" height="8" rx="4" fill="#1f2a37" fill-opacity="0.18"/>
  <rect x="44" y="112" width="92" height="8" rx="4" fill="#1f2a37" fill-opacity="0.18"/>
  <rect x="44" y="132" width="72" height="8" rx="4" fill="#1f2a37" fill-opacity="0.18"/>

  <!-- Settings card: the Theme and wallpaper section. -->
  <rect x="184" y="72" width="392" height="180" rx="12" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="184" y="72" width="392" height="180" rx="12" fill="none" stroke="#1f2a37" stroke-opacity="0.14" stroke-width="1.2"/>

  <!-- Section heading. -->
  <rect x="204" y="88" width="112" height="9" rx="4.5" fill="#1f2a37" fill-opacity="0.4"/>

  <!-- Theme segmented control, first option selected. -->
  <rect x="204" y="107" width="196" height="24" rx="9" fill="none" stroke="#1f2a37" stroke-opacity="0.22" stroke-width="1.2"/>
  <rect x="206" y="109" width="46" height="20" rx="7" fill="#247bbf"/>
  <rect x="262" y="115" width="38" height="8" rx="4" fill="#1f2a37" fill-opacity="0.24"/>
  <rect x="310" y="115" width="34" height="8" rx="4" fill="#1f2a37" fill-opacity="0.24"/>
  <rect x="354" y="115" width="40" height="8" rx="4" fill="#1f2a37" fill-opacity="0.24"/>

  <!-- Wallpaper thumbnail plus its alignment options. -->
  <rect x="204" y="141" width="104" height="60" rx="8" fill="url(#twp-thumb)"/>
  <rect x="204" y="141" width="104" height="60" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="204" y="213" width="22" height="15" rx="5" fill="#247bbf"/>
  <rect x="232" y="213" width="22" height="15" rx="5" fill="none" stroke="#1f2a37" stroke-opacity="0.22" stroke-width="1.2"/>
  <rect x="260" y="213" width="22" height="15" rx="5" fill="none" stroke="#1f2a37" stroke-opacity="0.22" stroke-width="1.2"/>
  <rect x="288" y="213" width="22" height="15" rx="5" fill="none" stroke="#1f2a37" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- Wallpaper dimming slider. -->
  <rect x="328" y="146" width="44" height="8" rx="4" fill="#1f2a37" fill-opacity="0.3"/>
  <rect x="380" y="147" width="176" height="6" rx="3" fill="#1f2a37" fill-opacity="0.16"/>
  <rect x="380" y="147" width="112" height="6" rx="3" fill="#247bbf"/>
  <circle cx="492" cy="150" r="7" fill="#ffffff" stroke="#247bbf" stroke-width="2"/>

  <!-- Panel translucency slider. -->
  <rect x="328" y="172" width="56" height="8" rx="4" fill="#1f2a37" fill-opacity="0.3"/>
  <rect x="380" y="173" width="176" height="6" rx="3" fill="#1f2a37" fill-opacity="0.16"/>
  <rect x="380" y="173" width="76" height="6" rx="3" fill="#247bbf"/>
  <circle cx="456" cy="176" r="7" fill="#ffffff" stroke="#247bbf" stroke-width="2"/>

  <!-- Remaining helper rows. -->
  <rect x="328" y="200" width="72" height="8" rx="4" fill="#1f2a37" fill-opacity="0.18"/>
  <rect x="328" y="218" width="150" height="8" rx="4" fill="#1f2a37" fill-opacity="0.14"/>
</svg>
